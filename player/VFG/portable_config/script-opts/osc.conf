# Ширина и отступы указаны в виртуальных координатах панели.
layout=bottombar
visibility=auto
custom_button_spacing=7
custom_button_group_spacing=12

# Генерация кадров
custom_button_1_content=VFG 2×
custom_button_1_width=94
custom_button_1_mbtn_left_command=script-message rtx-video-controls vfg-multiplier-menu

custom_button_2_content=Низкое
custom_button_2_width=78
custom_button_2_mbtn_left_command=script-message rtx-video-controls vfg-quality-next
custom_button_2_mbtn_right_command=script-message rtx-video-controls vfg-quality-previous

# Апскейл
custom_button_3_content=RTX SR
custom_button_3_width=66
custom_button_3_group_start=yes
custom_button_3_mbtn_left_command=script-message rtx-video-controls sr-toggle

custom_button_4_content=Размер
custom_button_4_width=64
custom_button_4_mbtn_left_command=script-message rtx-video-controls sr-next
custom_button_4_mbtn_right_command=script-message rtx-video-controls sr-previous
custom_button_4_wheel_up_command=script-message rtx-video-controls sr-next
custom_button_4_wheel_down_command=script-message rtx-video-controls sr-previous

# HDR
custom_button_5_content=RTX HDR
custom_button_5_width=84
custom_button_5_group_start=yes
custom_button_5_mbtn_left_command=script-message rtx-video-controls hdr-toggle

# Статистика
custom_button_6_content=Кадры
custom_button_6_width=60
custom_button_6_group_start=yes
custom_button_6_mbtn_left_command=script-message rtx-video-controls fps-status

# Language
custom_button_7_content=RU
custom_button_7_width=38
custom_button_7_group_start=yes
custom_button_7_mbtn_left_command=script-message rtx-video-controls language-toggle
