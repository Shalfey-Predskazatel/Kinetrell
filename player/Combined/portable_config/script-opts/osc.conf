# Генерация кадров
custom_button_1_content=RIFE
custom_button_1_width=62
custom_button_1_mbtn_left_command=script-message rtx-video-controls generator-menu

custom_button_2_content=2×
custom_button_2_width=62
custom_button_2_mbtn_left_command=script-message rtx-video-controls vfg-multiplier-menu

custom_button_3_content=4.17 Lite
